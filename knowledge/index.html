<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>点头教育 - AI运营知识展示台</title>
    <meta
      name="description"
      content="点头教育 - AI运营知识展示台。五色栏目做成瓷砖岛，点开看到每条知识。"
    />
    <meta name="theme-color" content="#f3efe6" />
    <meta property="og:title" content="点头教育 - AI运营知识展示台" />
    <meta property="og:description" content="栏目瓷砖岛。公开知识展示台。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="https://yexiaohanyao.github.io/path-lab-ai/knowledge/" />
    <link rel="canonical" href="https://yexiaohanyao.github.io/path-lab-ai/knowledge/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/showcase.css" />
  </head>
  <body>
    <a class="skip" href="#main">跳到主要内容</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="#about">
          <span class="seal" aria-hidden="true">点</span>
          <span class="brand-text">
            <span class="brand-name">点头教育 -</span>
            <span class="brand-sub">AI运营知识展示台</span>
          </span>
        </a>
        <nav class="nav" aria-label="页内目录">
          <a href="#about">我们是谁</a>
          <a href="#tiles">知识瓷砖</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="about" id="about" aria-labelledby="about-title">
        <div class="wrap about-row">
          <div>
            <p class="kicker">我们是谁</p>
            <h1 id="about-title">点头教育 - AI运营知识展示台</h1>
            <p class="lead">知识展示窗口，不是完整资料库。五条栏目铺成瓷砖岛，点开一格看到说明。</p>
          </div>
          <dl class="counts" aria-label="条目统计">
            <div>
              <dd>26</dd>
              <dt>条目</dt>
            </div>
            <div>
              <dd>3</dd>
              <dt>公开可看</dt>
            </div>
            <div>
              <dd>17</dd>
              <dt>申请查看</dt>
            </div>
            <div>
              <dd>3</dd>
              <dt>让团队知道</dt>
            </div>
            <div>
              <dd>1</dd>
              <dt>仅内部</dt>
            </div>
            <div>
              <dd>1</dd>
              <dt>内测</dt>
            </div>
            <div>
              <dd>1</dd>
              <dt>当前站点</dt>
            </div>
          </dl>
        </div>
      </section>

      <section class="section tiles" id="tiles" aria-labelledby="tiles-title">
        <div class="wrap">
          <div class="section-head" id="graph">
            <div>
              <p class="kicker">栏目瓷砖岛</p>
              <h2 id="tiles-title">五色栏目，格内短名</h2>
            </div>
            <p>悬停、聚焦或点选会点亮整块岛。点格子打开说明，不必连线。</p>
          </div>

          <div class="islands">
            <section class="island" id="ops" data-portal="ops" aria-labelledby="ops-title">
              <h3 class="island-title" id="ops-title"><span class="island-index">01</span>流量运营</h3>
              <div class="cells">
                <button type="button" class="cell" data-id="ops-materials" aria-haspopup="dialog" aria-controls="detail" aria-label="运营使用的资料，申请查看">
                  <strong>运营资料</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="prompt-skill" aria-haspopup="dialog" aria-controls="detail" aria-label="提示词 vs 上下文 vs Skill，申请查看">
                  <strong>提示词</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="juguang-risk" aria-haspopup="dialog" aria-controls="detail" aria-label="聚光风险表达，申请查看">
                  <strong>聚光风险</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="data-review" aria-haspopup="dialog" aria-controls="detail" aria-label="数据复盘表格，申请查看">
                  <strong>数据复盘</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="material-lib" aria-haspopup="dialog" aria-controls="detail" aria-label="素材库，申请查看">
                  <strong>素材库</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="xhs-library" aria-haspopup="dialog" aria-controls="detail" aria-label="小红书资料库 2.0，申请查看">
                  <strong>资料库</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="major-list" aria-haspopup="dialog" aria-controls="detail" aria-label="专业列表（三版本），申请查看">
                  <strong>专业列表</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="sop-marketing" aria-haspopup="dialog" aria-controls="detail" aria-label="营销 SOP ver2.0，申请查看">
                  <strong>营销 SOP</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="sop-xhs" aria-haspopup="dialog" aria-controls="detail" aria-label="小红书运营 SOP，申请查看">
                  <strong>小红书运营 SOP</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="topic-pack" aria-haspopup="dialog" aria-controls="detail" aria-label="AI+专业课题入门包，让团队知道">
                  <strong>课题入门包</strong>
                  <span class="badge" data-access="team">让团队知道</span>
                </button>
                <button type="button" class="cell" data-id="algo-pack" aria-haspopup="dialog" aria-controls="detail" aria-label="AI算法入门包，让团队知道">
                  <strong>算法入门包</strong>
                  <span class="badge" data-access="team">让团队知道</span>
                </button>
              </div>
            </section>

            <section class="island" id="product" data-portal="product" aria-labelledby="product-title">
              <h3 class="island-title" id="product-title"><span class="island-index">02</span>产品可视化</h3>
              <div class="cells">
                <button type="button" class="cell" data-id="v7-manual" aria-haspopup="dialog" aria-controls="detail" aria-label="V7.0 系统班产品手册，申请查看">
                  <strong>系统班</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="employment-manual" aria-haspopup="dialog" aria-controls="detail" aria-label="就业班产品手册 / AI职通车，申请查看">
                  <strong>就业班</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="conversion" aria-haspopup="dialog" aria-controls="detail" aria-label="转化产品介绍，申请查看">
                  <strong>转化产品介绍</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
              </div>
            </section>

            <section class="island" id="vibe" data-portal="vibe" aria-labelledby="vibe-title">
              <h3 class="island-title" id="vibe-title"><span class="island-index">03</span>工具站点</h3>
              <div class="cells">
                <button type="button" class="cell" data-id="path-lab" aria-haspopup="dialog" aria-controls="detail" aria-label="AI路径实验室，当前站点">
                  <strong>路径实验室</strong>
                  <span class="badge" data-access="site">当前站点</span>
                </button>
                <button type="button" class="cell" data-id="papers" aria-haspopup="dialog" aria-controls="detail" aria-label="论文交互馆，公开可看">
                  <strong>论文馆</strong>
                  <span class="badge" data-access="public">公开可看</span>
                </button>
                <button type="button" class="cell" data-id="material-collector" aria-haspopup="dialog" aria-controls="detail" aria-label="多平台素材采集器，申请查看">
                  <strong>素材采集</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="workbench-daily" aria-haspopup="dialog" aria-controls="detail" aria-label="每日工作台，仅内部">
                  <strong>每日工作台</strong>
                  <span class="badge" data-access="internal">仅内部</span>
                </button>
                <button type="button" class="cell" data-id="workbench-creator" aria-haspopup="dialog" aria-controls="detail" aria-label="素材创作台，申请查看">
                  <strong>素材创作台</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="workbench-research" aria-haspopup="dialog" aria-controls="detail" aria-label="科研工作台，让团队知道">
                  <strong>科研工作台</strong>
                  <span class="badge" data-access="team">让团队知道</span>
                </button>
                <button type="button" class="cell" data-id="papers-pack" aria-haspopup="dialog" aria-controls="detail" aria-label="AI 论文包，申请查看">
                  <strong>AI 论文包</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
              </div>
            </section>

            <section class="island" id="beta" data-portal="beta" aria-labelledby="beta-title">
              <h3 class="island-title" id="beta-title"><span class="island-index">04</span>测试中</h3>
              <div class="cells">
                <button type="button" class="cell" data-id="jev" aria-haspopup="dialog" aria-controls="detail" aria-label="jev 接量助手，中断、内测">
                  <strong>jev</strong>
                  <span class="badge" data-access="beta">内测</span>
                </button>
                <button type="button" class="cell" data-id="shuishou" aria-haspopup="dialog" aria-controls="detail" aria-label="水手｜红书制帖师 Agent 演示站，公开可看">
                  <strong>水手</strong>
                  <span class="badge" data-access="public">公开可看</span>
                </button>
                <button type="button" class="cell" data-id="six" aria-haspopup="dialog" aria-controls="detail" aria-label="AI 运营六维能力测试，公开可看">
                  <strong>六维测试</strong>
                  <span class="badge" data-access="public">公开可看</span>
                </button>
              </div>
            </section>

            <section class="island" id="fengxu" data-portal="fengxu" aria-labelledby="fengxu-title">
              <h3 class="island-title" id="fengxu-title"><span class="island-index">05</span>风絮</h3>
              <div class="cells">
                <button type="button" class="cell" data-id="dedao-ai" aria-haspopup="dialog" aria-controls="detail" aria-label="得到AI圈，申请查看">
                  <strong>得到AI</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
                <button type="button" class="cell" data-id="shengcai" aria-haspopup="dialog" aria-controls="detail" aria-label="生财有术，申请查看">
                  <strong>生财</strong>
                  <span class="badge" data-access="request">申请查看</span>
                </button>
              </div>
            </section>
          </div>
          <p id="tiles-status" class="sr-only" aria-live="polite"></p>
          <noscript>
            <p class="stage-note">脚本停用时，栏目名称仍可阅读。申请查看、让团队知道、仅内部和内测的材料请记下名称。</p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <div class="footer-brand">
          <span class="seal seal-sm" aria-hidden="true">点</span>
          <div>
            <p class="footer-name">点头教育 - AI运营知识展示台</p>
            <p class="footer-sub">公开知识展示</p>
          </div>
        </div>
        <p class="footer-note">本站是公开的知识瓷砖展示台。</p>
        <a class="footer-top" href="#about">回到页首</a>
      </div>
    </footer>

    <dialog class="detail" id="detail" aria-labelledby="detail-title">
      <article class="detail-card">
        <button class="detail-close" id="detail-close" type="button">关闭</button>
        <div class="shot detail-shot" id="detail-shot"></div>
        <div class="detail-body">
          <p class="detail-kicker" id="detail-kicker"></p>
          <h3 id="detail-title"></h3>
          <p class="detail-summary" id="detail-summary"></p>
          <p class="detail-copy" id="detail-copy"></p>
          <ul class="parts" id="detail-parts" hidden></ul>
          <div class="detail-gallery" id="detail-gallery"></div>
          <div class="detail-actions" id="detail-actions"></div>
        </div>
      </article>
    </dialog>

    <script src="./assets/showcase.js" defer></script>
  </body>
</html>
