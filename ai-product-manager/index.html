    {id:'T03',stage:4,title:'技术协作：RAG / Agent 选型',hours:8,category:'技术协作',source:'S1',sourceRef:'第 3 阶段；S4 第 3、6 阶段',prereq:['T02','P08'],optional:'tech',tags:['架构选型','停止条件'],learn:'区分固定工作流与动态工具调用，理解检索、状态、人工确认和停止条件。',tasks:['画出「{project}」的组件关系，说明知识库、模型、工具和界面的职责。','比较固定流程与 Agent 方案，列出最大迭代数、成本上限、退出与人工确认条件。'],deliver:'架构草图 + 技术选型说明',check:'选型与任务需求相符，能够追踪失败和停止原因。',resource:'langgraph'},

    {id:'J01',stage:6,title:'求职扩展：整理作品集',hours:6,category:'评估与交付',source:'S1',sourceRef:'6.3；S4 补充学习阶段',prereq:['P12'],optional:'job',tags:['作品集','项目表达'],learn:'将项目过程转成有证据的岗位材料，说明个人贡献、取舍与局限。',tasks:['对照一个真实岗位说明，整理需求、原型、流程、测试和复盘材料。','录制 5 分钟演示，按问题、方案、证据与下一步组织讲解。'],deliver:'作品集目录 + 演示视频提纲',check:'没有虚构客户、业务收益或模型指标；课堂和个人练习身份明确。'},

<script>(function(root){
  const C=root.PM_CATALOG;
  const defaults={background:'pm',ai:'chat',coding:'none',goal:'demo',depth:'core',project:'invoice',hours:10,weeks:12};
  function normalize(p={}){
    if(!p||typeof p!=='object')p={};
    const take=(list,key)=>list.some(x=>x.id===p[key])?p[key]:defaults[key];
    return {background:take(C.backgrounds,'background'),ai:take(C.aiLevels,'ai'),coding:take(C.codingLevels,'coding'),goal:take(C.goals,'goal'),depth:p.depth==='tech'?'tech':'core',project:take(C.projects,'project'),hours:Math.max(3,Math.min(20,Math.round(Number(p.hours)||defaults.hours))),weeks:Math.max(4,Math.min(32,Math.round(Number(p.weeks)||defaults.weeks)))};
  }
  function hourEstimate(m,p){
    let hours=m.hours;
    const pm={P02:-4,P03:-2,P04:-2,P05:-4,P12:-2},business={P02:-2,P03:-2,P04:-2},dev={P06:-2,P07:-2,P09:-2};
    if(p.background==='new'&&!m.optional)hours+=m.stage<=3?3:2;
    if(p.background==='pm')hours+=pm[m.id]||0;
    if(p.background==='business')hours+=business[m.id]||0;
    if(p.background==='dev')hours+=dev[m.id]||0;
    if(p.ai==='prompt'&&m.id==='P06')hours-=2;
    if(p.ai==='workflow')hours+=({P06:-4,P07:-4,P08:-2,P09:-2})[m.id]||0;
    if(m.id==='T02')hours+=p.coding==='none'?12:p.coding==='read'?4:-2;
    if(m.id==='T01'&&p.coding==='build')hours-=2;
    return Math.max(2,hours);
  }
  function build(p={}){
    const profile=normalize(p),project=C.projects.find(x=>x.id===profile.project),background=C.backgrounds.find(x=>x.id===profile.background),goal=C.goals.find(x=>x.id===profile.goal),budget=profile.hours*profile.weeks;
    const lookup=Object.fromEntries(C.modules.map(m=>[m.id,m]));
    let ids=['P01','P02','P03','P04','P05'];
    if(profile.depth==='tech')ids.push('T01');ids.push('P06','P07');
    if(profile.depth==='tech')ids.push('T02');ids.push('P08');
    if(profile.depth==='tech')ids.push('T03');ids.push('P09','P10','P11');
    if(profile.depth==='tech')ids.push('T04');ids.push('P12');
    if(profile.goal==='job')ids.push('J01','J02');
    if(profile.goal==='pilot')ids.push('B01','B02');
    const values={project:project.name,user:project.user,problem:project.problem,input:project.input,fields:project.fields,rule:project.rule,knowledge:project.knowledge,review:project.review};
    project.versions.forEach((v,i)=>values['v'+(i+1)]=`${project.name} ${v.label} · ${v.name}`);
    const fill=s=>String(s).replace(/\{(\w+)\}/g,(all,k)=>values[k]||all);
    let cursor=0;
    const modules=ids.map(id=>{
      const m=lookup[id],hours=hourEstimate(m,profile),start=cursor;cursor+=hours;
      const allocated=Math.max(0,Math.min(hours,budget-start));
      return {...m,hours,start,end:cursor,allocated,status:allocated===hours?'included':allocated===0?'later':'partial',startWeek:Math.floor(start/profile.hours)+1,endWeek:Math.ceil(cursor/profile.hours),learn:fill(m.learn),tasks:m.tasks.map(fill),deliver:fill(m.deliver),check:fill(m.check)};
    });
    const total=cursor,planned=Math.min(total,budget),shortfall=Math.max(0,total-budget),reserve=Math.max(0,budget-total);
    const stages=C.stages.map(s=>{
      const items=modules.filter(m=>m.stage===s.id),start=items[0].start,end=items.at(-1).end,hours=items.reduce((n,m)=>n+m.hours,0),allocated=items.reduce((n,m)=>n+m.allocated,0);
      return {...s,modules:items,start,end,hours,allocated,startWeek:Math.floor(start/profile.hours)+1,endWeek:Math.ceil(end/profile.hours),status:allocated===hours?'included':allocated===0?'later':'partial'};
    });
    const weeks=Array.from({length:profile.weeks},(_,i)=>{
      const start=i*profile.hours,end=start+profile.hours;
      const items=modules.map(m=>({id:m.id,title:m.title,stage:m.stage,hours:Math.max(0,Math.min(m.end,end)-Math.max(m.start,start)),totalHours:m.hours,deliver:m.deliver,finalPart:m.end<=end&&m.end>start})).filter(m=>m.hours>0);
      return {n:i+1,items,reserve:profile.hours-items.reduce((n,m)=>n+m.hours,0)};
    });
    const categories=[...new Set(modules.map(m=>m.category))].map(name=>({name,hours:modules.filter(m=>m.category===name).reduce((n,m)=>n+m.hours,0)}));
    const reasons=[background.note,profile.ai==='workflow'?'你做过工作流，相关基础模块缩短为复核；检索和评估仍需实际练习。':profile.ai==='prompt'?'已有 Prompt 经验，Dify 入门减少重复练习；保留变量、分支和调试任务。':'从对话体验进到产品实践，先明确模型的输入、输出与失败处理。',profile.depth==='tech'?'加入 API、AI 辅助实现、架构选型和上线验收四个技术协作模块。':'先用低代码走完产品主线，重点产出需求、原型、可运行流程与评估记录。',goal.note];
    const progressKey=JSON.stringify({background:profile.background,ai:profile.ai,coding:profile.coding,depth:profile.depth,project:profile.project});
    return {profile,project,background,goal,modules,stages,weeks,total,budget,planned,shortfall,reserve,categories,reasons,requiredWeeks:Math.ceil(total/profile.hours),extraWeeks:Math.ceil(shortfall/profile.hours),covered:modules.filter(m=>m.status==='included').length,coreCount:12,progressKey};
  }
  function weekRange(m){return m.startWeek===m.endWeek?`第 ${m.startWeek} 周`:`第 ${m.startWeek}–${m.endWeek} 周`;}
  function prompt(route,id){
    const m=route.modules.find(x=>x.id===id);if(!m)return'';
    return `你是我的 AI 产品经理学习教练。\n学习背景：${route.background.label}；AI 基础：${C.aiLevels.find(x=>x.id===route.profile.ai).label}；编程基础：${C.codingLevels.find(x=>x.id===route.profile.coding).label}。\n目标：${route.goal.label}。\n贯穿项目：${route.project.name}。\n项目用户：${route.project.user}。\n当前模块：${m.id} ${m.title}。\n学习内容：${m.learn}\n具体任务：\n${m.tasks.map((t,i)=>`${i+1}. ${t}`).join('\n')}\n完成凭证：${m.deliver}\n验收要求：${m.check}\n来源：${C.sources.find(s=>s.id===m.source).title}，${m.sourceRef}。\n请先检查我的理解，再带我做一个小步骤，提供可以验证的练习。使用虚构或脱敏样例，明确标记假设；不要编造用户访谈、实验分数、客户经历或完成情况。给代码时解释输入输出和测试办法。`;
  }
  function markdown(route,done=[]){
    const r=route,p=r.profile,d=new Set(done);
    let text=`# AI 产品经理学习路径\n\n## 学习设定\n\n- 背景：${r.background.label}\n- AI 基础：${C.aiLevels.find(x=>x.id===p.ai).label}\n- 编程基础：${C.codingLevels.find(x=>x.id===p.coding).label}\n- 目标：${r.goal.label}\n- 深度：${p.depth==='tech'?'PM 主线 + 技术协作':'PM 主线'}\n- 贯穿项目：${r.project.name}（${r.project.kind}）\n- 本期：${p.weeks} 周 × ${p.hours}h，共 ${r.budget}h\n- 任务估计：${r.total}h，按每周投入约 ${r.requiredWeeks} 周\n- 本期安排：${r.planned}h；机动：${r.reserve}h；后续还需：${r.shortfall}h\n\n工时由规划规则估计，不是课程官方课时，也不是掌握能力或获得录用的保证。\n`;
    if(r.shortfall)text+=`\n**这是起步周期：本期可完整安排 ${r.covered} / ${r.modules.length} 个模块，后续还需约 ${r.extraWeeks} 周。**\n`;
