        <p class="pr-lead">团队项目、课程实践与学员作品。</p>
      </div>
      <figure class="pr-motion" aria-labelledby="project-motion-title" aria-describedby="project-motion-description">
        <input class="pr-motion-toggle" type="checkbox" id="projectMotionPause" aria-label="暂停项目过程动画">
        <label class="pr-motion-control" for="projectMotionPause" title="暂停或继续动画"><span class="pr-motion-pause-label">暂停动效</span><span class="pr-motion-play-label">继续动效</span></label>
        <div class="pr-motion-scene">
          <div class="pr-compare-heading"><h2 id="project-motion-title">一个想法，两种实现方式。</h2><span>THE MAKING OF A PROJECT</span></div>
          <div class="pr-traditional" aria-label="传统路径：人逐项推进，查资料、做设计、写代码、做测试">
            <div class="pr-lane-heading"><span class="pr-lane-name"><i></i>传统路径</span><span>人逐项推进</span></div>
            <div class="pr-manual-flow" aria-hidden="true">
              <div class="pr-manual-person"><div class="pr-mini-person"><i></i><b></b><em></em></div><span>一个人，多个角色</span></div>
              <div class="pr-manual-steps">
                <div class="pr-manual-step"><i class="pr-drawing-doc"><b></b><b></b><b></b></i><span>查资料</span></div>
                <div class="pr-manual-step"><i class="pr-drawing-layout"><b></b><b></b></i><span>做设计</span></div>
                <div class="pr-manual-step"><i class="pr-drawing-code">&lt;/&gt;</i><span>写代码</span></div>
                <div class="pr-manual-step"><i class="pr-drawing-check"></i><span>做测试</span></div>
              </div>
              <div class="pr-manual-finish"><i></i><span>项目</span></div>
            </div>
          </div>
          <div class="pr-ai-studio">
            <div class="pr-studio-grid" aria-hidden="true"></div>
            <div class="pr-lane-heading"><span class="pr-lane-name"><i></i>AI 路径 <em>人 × AI AGENT</em></span><span class="pr-studio-live"><i></i>协作进行中</span></div>
            <div class="pr-collaboration">
              <div class="pr-human-station">
                <div class="pr-human-brief">我想解决这个问题<span aria-hidden="true">✦</span></div>
                <div class="pr-human-drawing" role="img" aria-label="坐在电脑前确定项目方向的人">
                  <div class="pr-chair"></div><div class="pr-person-neck"></div><div class="pr-person-shirt"></div>
                  <div class="pr-person-arm pr-person-arm-left"></div><div class="pr-person-arm pr-person-arm-right"></div>
                  <div class="pr-person-head"><i class="pr-person-hair"></i><i class="pr-person-ear"></i><i class="pr-person-brow"></i><i class="pr-person-glasses"></i><i class="pr-person-nose"></i><i class="pr-person-smile"></i></div>
                  <div class="pr-human-desk"></div><i class="pr-person-hand pr-person-hand-left"></i><i class="pr-person-hand pr-person-hand-right"></i>
                  <div class="pr-human-laptop"><span>✦</span></div><div class="pr-human-keyboard"></div><div class="pr-human-mug"></div>
                </div>
                <div class="pr-human-label"><strong>你，掌握方向</strong><span>定义问题 · 判断结果</span></div>
              </div>
              <div class="pr-agent-station" role="group" aria-label="协作中的 AI Agent，聚焦角色可了解分工">
                <div class="pr-agent-orbit" aria-hidden="true"></div>
                <div class="pr-agent-wire pr-agent-wire-one" aria-hidden="true"><i></i></div><div class="pr-agent-wire pr-agent-wire-two" aria-hidden="true"><i></i></div>
                <div class="pr-agent-core" aria-hidden="true"><span>AI</span><small>AGENTS</small><i></i></div>
                <div class="pr-agent pr-agent-research" tabindex="0" role="img" aria-label="资料 Agent：查找资料，整理关键线索"><div class="pr-bot"><i class="pr-bot-antenna"></i><div class="pr-bot-face"><i></i><i></i></div><span class="pr-bot-body"></span></div><b>资料 Agent</b><span class="pr-agent-tip" aria-hidden="true">查找资料，整理线索</span></div>
                <div class="pr-agent pr-agent-design" tabindex="0" role="img" aria-label="设计 Agent：梳理流程，生成原型"><div class="pr-bot"><i class="pr-bot-antenna"></i><div class="pr-bot-face"><i></i><i></i></div><span class="pr-bot-body"></span></div><b>设计 Agent</b><span class="pr-agent-tip" aria-hidden="true">梳理流程，生成原型</span></div>
                <div class="pr-agent pr-agent-build" tabindex="0" role="img" aria-label="开发 Agent：编写代码，搭建功能"><div class="pr-bot"><i class="pr-bot-antenna"></i><div class="pr-bot-face"><i></i><i></i></div><span class="pr-bot-body"></span></div><b>开发 Agent</b><span class="pr-agent-tip" aria-hidden="true">编写代码，搭建功能</span></div>
                <div class="pr-agent pr-agent-review" tabindex="0" role="img" aria-label="测试 Agent：检查结果，反馈问题"><div class="pr-bot"><i class="pr-bot-antenna"></i><div class="pr-bot-face"><i></i><i></i></div><span class="pr-bot-body"></span></div><b>测试 Agent</b><span class="pr-agent-tip" aria-hidden="true">检查结果，反馈问题</span></div>
              </div>
              <div class="pr-project-station">
                <div class="pr-project-window" role="img" aria-label="逐步形成的项目界面，由人确认与改进">
                  <div class="pr-project-chrome"><span><i></i><i></i><i></i></span><b>你的项目</b><em>↗</em></div>
                  <div class="pr-project-cover"><span class="pr-project-orb"></span><i class="pr-project-ring"></i><div><small>FROM IDEA</small><strong>让想法<br>成为作品。</strong></div></div>
                  <div class="pr-project-modules"><i><b></b><b></b></i><i><b></b><b></b></i><i><b></b><b></b></i></div>
                  <div class="pr-project-bottom"><span><i></i>预览项目</span><b>↗</b></div>
                </div>
                <div class="pr-project-approved"><i></i><span>由你确认，持续改进</span></div>
              </div>
            </div>
            <div class="pr-studio-flow" aria-hidden="true"><span><i>01</i>人定方向</span><b>→</b><span><i>02</i>Agent 分工协作</span><b>→</b><span><i>03</i>人来验收</span></div>
          </div>
        </div>
        <figcaption id="project-motion-description">从一个人逐项推进，到人与 Agent 协作完成。<span>过程示意</span></figcaption>
      </figure>
    </section>
    <section class="pr-library" id="project-list" aria-labelledby="project-list-title">
